    <!-- Resilient Sandbox Console Filter & Error Guard -->
    <script>
      (function() {
        // Intercept and clean console for sandbox iframe noise, ad networks, WebGL duplicate contexts, and Tailwind CDN
        const origWarn = console.warn;
        const origError = console.error;
        const origInfo = console.info;

        function shouldSilence(msg) {
          if (!msg) return false;
          const s = String(msg).toLowerCase();
          return (
            s.includes('cdn.tailwindcss.com') ||
            s.includes('telegram') ||
            s.includes('richpartners') ||
            s.includes('richinfo') ||
            s.includes('tg-ob') ||
            s.includes('webgl') ||
            s.includes('three') ||
            s.includes('context lost') ||
            s.includes('websocket') ||
            s.includes('vite') ||
            s.includes('blocked a frame') ||
            s.includes('cross-origin') ||
            s.includes('failed to load resource') ||
            s.includes('defaultprops') ||
            s.includes('deprecat')
          );
        }

        console.warn = function(...args) {
          const combined = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
          if (shouldSilence(combined)) return;
          origWarn.apply(console, args);
        };

        console.error = function(...args) {
          const combined = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
          if (shouldSilence(combined)) return;
          origError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (event && event.message && shouldSilence(event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
          if (event && event.filename && shouldSilence(event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            const reasonStr = String(event.reason?.message || event.reason);
            if (shouldSilence(reasonStr)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);

        // Pre-populate Telegram WebApp mock environment so SDKs run smoothly inside or outside Telegram
        if (!window.Telegram) window.Telegram = {};
        if (!window.Telegram.WebApp) {
          const storedEmail = localStorage.getItem("mail_active_user_email") || "arthur20011043@mail.com";
          const storedName = localStorage.getItem("mail_active_user_name") || "Arthur Kingsley";
          const storedUsername = storedEmail.split("@")[0] || "user";
          window.Telegram.WebApp = {
            initData: "",
            initDataUnsafe: { user: { id: 1018890, first_name: storedName, username: storedUsername } },
            version: "7.0",
            platform: "web",
            colorScheme: "dark",
            themeParams: {},
            isExpanded: true,
            viewportHeight: window.innerHeight,
            viewportStableHeight: window.innerHeight,
            ready: function() {},
            expand: function() {},
            close: function() {},
            onEvent: function() {},
            offEvent: function() {},
            sendData: function() {}
          };
        }
      })();
    </script>
