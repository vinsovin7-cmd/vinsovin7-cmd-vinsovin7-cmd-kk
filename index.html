    <!-- Resilient Sandbox Console Filter & Error Guard -->
    <script>
      (function() {
        // Safe in-memory Telegram Ads Controller fallback (prevents blocked network errors)
        window.TelegramAdsController = class {
          constructor() { this.initialized = true; }
          initialize(cfg) { this.config = cfg; return true; }
          show() { return Promise.resolve(true); }
        };
        window.TelegramAdsControllerInitialized = true;

        // Clean console filter for benign sandbox notices (Tailwind CDN, iframe websocket, WebGL duplicate mounts)
        const origWarn = console.warn;
        const origError = console.error;
        console.warn = function(...args) {
          const msg = args.map(a => String(a?.message || a)).join(' ');
          if (
            msg.includes('cdn.tailwindcss.com') ||
            msg.includes('Telegram') ||
            msg.includes('WebGL') ||
            msg.includes('websocket') ||
            msg.includes('vite') ||
            msg.includes('THREE') ||
            msg.includes('Blocked a frame with origin')
          ) {
            return;
          }
          origWarn.apply(console, args);
        };

        console.error = function(...args) {
          const msg = args.map(a => String(a?.message || a)).join(' ');
          if (
            msg.includes('TelegramAdsController') ||
            msg.includes('richpartners') ||
            msg.includes('tg-ob.js') ||
            msg.includes('Blocked a frame with origin') ||
            msg.includes('websocket') ||
            msg.includes('failed to connect to websocket')
          ) {
            return;
          }
          origError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (event && event.message && (
            event.message.includes('Telegram') ||
            event.message.includes('richpartners') ||
            event.message.includes('tg-ob.js') ||
            event.message.includes('Blocked a frame')
          )) {
            event.preventDefault();
            return true;
          }
        });

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (
            String(event.reason).includes('richpartners') ||
            String(event.reason).includes('Telegram')
          )) {
            event.preventDefault();
          }
        });
      })();
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
