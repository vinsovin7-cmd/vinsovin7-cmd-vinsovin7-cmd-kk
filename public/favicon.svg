<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0E"/>
      <stop offset="100%" stop-color="#181B26"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#926B29"/>
    </linearGradient>
    <linearGradient id="quantumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#C5A059" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Quantum Entanglement / Orbit Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#quantumGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Quantum Lattice Nodes -->
  <circle cx="14" cy="22" r="2.5" fill="#38BDF8"/>
  <circle cx="50" cy="42" r="2.5" fill="#38BDF8"/>
  <circle cx="48" cy="18" r="2" fill="#F59E0B"/>
  <circle cx="16" cy="46" r="2" fill="#F59E0B"/>

  <!-- Greek Alpha (α) Symbol -->
  <text x="32" y="44" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-1">α</text>

  <!-- Sparkle Accent -->
  <circle cx="41" cy="19" r="1.5" fill="#FFFFFF"/>
</svg>
